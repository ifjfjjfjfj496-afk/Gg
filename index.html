<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFS Carbon - Web Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #0b0e14; overflow: hidden; }
        #game-container { width: 100%; height: 100vh; position: relative; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="game"></div>
</div>

<script type="text/javascript">
    window.EJS_player = '#game';
    window.EJS_core = 'psx';
    window.EJS_gameName = 'Need for Speed Carbon';
    window.EJS_color = '#00aaff';
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_onVirtualGamepad = true;
    window.EJS_gameUrl = 'https://raw.githubusercontent.com/emulatorjs/ejstests/master/roms/nfs.zip';
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
